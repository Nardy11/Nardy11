name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate themed snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nardy11
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322d3ee&color_dots=%23111827,%231e1b4b,%23312e81,%234f46e5,%23a78bfa
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2367e8f9&color_dots=%230b1020,%231e1b4b,%23312e81,%236366f1,%23c4b5fd

      - name: Publish themed snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
