<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f8fafc; --border: #e2e8f0; --grid: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --line: #4f46e5;
    --area-from: rgba(99,102,241,.45); --area-to: rgba(167,139,250,.02);
    --l0: #eef2ff; --l1: #c7d2fe; --l2: #a5b4fc; --l3: #6366f1; --l4: #4338ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --panel: #111827; --border: #1e293b; --grid: #1e293b;
      --text: #e2e8f0; --muted: #94a3b8; --line: #67e8f9;
      --area-from: rgba(34,211,238,.45); --area-to: rgba(99,102,241,.02);
      --l0: #161e33; --l1: #1e3a5f; --l2: #2563eb; --l3: #38bdf8; --l4: #67e8f9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 56px; background: var(--bg); color: var(--text);
    font: 400 15px/1.55 -apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .sub a { color: inherit; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 20px 14px; margin-bottom: 24px;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 16px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 11px; }
  .line { fill: none; stroke: var(--line); stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  .crosshair { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .marker { fill: var(--line); opacity: 0; }
  .cell { rx: 2; ry: 2; }
  .cell:hover { stroke: var(--text); stroke-width: 1.4; }
  .legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end;
            color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .tip {
    position: fixed; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
    background: var(--text); color: var(--bg); padding: 7px 10px; border-radius: 7px;
    font-size: 12.5px; line-height: 1.35; white-space: nowrap; z-index: 10;
    transition: opacity .08s ease;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 24px; }
  .stat .n { font-size: 22px; font-weight: 650; }
  .stat .k { color: var(--muted); font-size: 12.5px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 640px) { .stats { gap: 18px; } h1 { font-size: 20px; } }
</style>

var fmt = new Intl.DateTimeFormat(undefined,

function el(name, attrs) {
  var n = document.createElementNS(NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);

}

function niceMax(v) {
  if (v <= 5) return 5;
  var step = Math.pow(10, String(v).length - 1);
  var mults = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < mults.length; i++) {
    if (step * mults[i] >= v) return step * mults[i];
